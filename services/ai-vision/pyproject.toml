[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "shelfops-ai-vision"
version = "0.1.0"
description = "ShelfOps vision service: shelf detection, geometry metrics, OCR stub (FastAPI + gRPC)."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "fastapi==0.115.6",
  "uvicorn==0.32.1",
  "grpcio==1.68.1",
  "grpcio-tools==1.68.1",
  "protobuf==5.29.3",
  "pydantic-settings==2.7.0",
  "python-multipart==0.0.20",
]

[project.optional-dependencies]
dev = [
  "pytest==8.3.4",
  "pytest-asyncio==0.25.0",
  "httpx==0.28.1",
  "ruff==0.8.4",
  "mypy==1.14.0",
]

[tool.hatch.build.targets.wheel]
packages = ["app", "gen/shelfops"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_functions = ["test_*"]
addopts = ["-q"]
asyncio_default_fixture_loop_scope = "function"

[tool.ruff]
line-length = 100
target-version = "py311"
extend-exclude = ["gen"]

[tool.mypy]
python_version = "3.11"
ignore_missing_imports = true
warn_unused_configs = true
