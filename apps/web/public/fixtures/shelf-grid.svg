      <rect x="104" y="650" width="84" height="34" rx="6" fill="#1d4ed8"/>
      <rect x="296" y="668" width="120" height="144" rx="8" fill="#f97316"/>
      <rect x="316" y="638" width="80" height="34" rx="6" fill="#c2410c"/>
      <rect x="506" y="690" width="120" height="122" rx="8" fill="#10b981"/>
      <rect x="526" y="660" width="80" height="34" rx="6" fill="#047857"/>
    </g>
    <!-- slot kosong: kolom 4 baris 3 -->
    <g>
      <rect x="696" y="650" width="170" height="166" rx="6" fill="#0b0b0d" stroke="#52525b" stroke-dasharray="8 8" stroke-width="3"/>
      <rect x="716" y="806" width="130" height="8" rx="4" fill="#3f3f46"/>
    </g>
    <g>
      <rect x="906" y="676" width="120" height="136" rx="8" fill="#a855f7"/>
      <rect x="926" y="646" width="80" height="34" rx="6" fill="#7e22ce"/>
      <rect x="1116" y="686" width="120" height="126" rx="8" fill="#0ea5e9"/>
      <rect x="1136" y="656" width="80" height="34" rx="6" fill="#0369a1"/>
      <rect x="1326" y="670" width="120" height="142" rx="8" fill="#f43f5e"/>
      <rect x="1346" y="640" width="80" height="34" rx="6" fill="#9f1239"/>
