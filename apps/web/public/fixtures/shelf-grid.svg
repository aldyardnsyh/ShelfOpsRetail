<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-label="Ilustrasi rak toko dengan tiga baris dan tujuh kolom facing">
  <defs>
    <linearGradient id="back" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1c1c20"/>
      <stop offset="1" stop-color="#101013"/>
    </linearGradient>
    <linearGradient id="board" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#3f3f46"/>
      <stop offset="1" stop-color="#27272a"/>
    </linearGradient>
  </defs>

  <rect width="1600" height="900" fill="url(#back)"/>

  <!-- papan rak -->
  <g fill="url(#board)">
    <rect x="30" y="336" width="1540" height="22" rx="4"/>
    <rect x="30" y="576" width="1540" height="22" rx="4"/>
    <rect x="30" y="816" width="1540" height="22" rx="4"/>
  </g>

  <!-- produk per slot: 7 kolom x 3 baris. Slot 3, 10, 17 sengaja kosong. -->
  <g>
    <!-- baris 1 -->
    <g>
      <rect x="86" y="200" width="120" height="132" rx="8" fill="#2563eb"/>
      <rect x="104" y="170" width="84" height="34" rx="6" fill="#1d4ed8"/>
      <rect x="296" y="188" width="120" height="144" rx="8" fill="#0ea5e9"/>
      <rect x="316" y="158" width="80" height="34" rx="6" fill="#0284c7"/>
      <rect x="506" y="210" width="120" height="122" rx="8" fill="#14b8a6"/>
      <rect x="526" y="180" width="80" height="34" rx="6" fill="#0f766e"/>
    </g>
    <!-- slot kosong: kolom 4 baris 1 -->
    <g>
      <rect x="696" y="170" width="170" height="166" rx="6" fill="#0b0b0d" stroke="#52525b" stroke-dasharray="8 8" stroke-width="3"/>
      <rect x="716" y="326" width="130" height="8" rx="4" fill="#3f3f46"/>
    </g>
    <g>
      <rect x="906" y="196" width="120" height="136" rx="8" fill="#f59e0b"/>
      <rect x="926" y="166" width="80" height="34" rx="6" fill="#b45309"/>
      <rect x="1116" y="206" width="120" height="126" rx="8" fill="#ef4444"/>
      <rect x="1136" y="176" width="80" height="34" rx="6" fill="#b91c1c"/>
      <rect x="1326" y="190" width="120" height="142" rx="8" fill="#8b5cf6"/>
      <rect x="1346" y="160" width="80" height="34" rx="6" fill="#6d28d9"/>
