    <g>
      <rect x="906" y="436" width="120" height="136" rx="8" fill="#ec4899"/>
      <rect x="926" y="406" width="80" height="34" rx="6" fill="#be185d"/>
      <rect x="1116" y="446" width="120" height="126" rx="8" fill="#64748b"/>
      <rect x="1136" y="416" width="80" height="34" rx="6" fill="#475569"/>
      <rect x="1326" y="430" width="120" height="142" rx="8" fill="#84cc16"/>
      <rect x="1346" y="400" width="80" height="34" rx="6" fill="#4d7c0f"/>
    </g>

    <!-- baris 3 -->
