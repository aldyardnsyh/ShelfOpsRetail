  </g>

  <!-- label harga di tepi papan -->
  <g fill="#a1a1aa" font-family="Arial, sans-serif" font-size="18">
    <text x="44" y="368">R1</text>
    <text x="44" y="608">R2</text>
    <text x="44" y="848">R3</text>
  </g>
</svg>