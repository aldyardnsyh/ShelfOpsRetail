    <!-- baris 2 -->
    <g>
      <rect x="86" y="440" width="120" height="132" rx="8" fill="#22c55e"/>
      <rect x="104" y="410" width="84" height="34" rx="6" fill="#15803d"/>
      <rect x="296" y="428" width="120" height="144" rx="8" fill="#06b6d4"/>
      <rect x="316" y="398" width="80" height="34" rx="6" fill="#0e7490"/>
      <rect x="506" y="450" width="120" height="122" rx="8" fill="#eab308"/>
      <rect x="526" y="420" width="80" height="34" rx="6" fill="#a16207"/>
