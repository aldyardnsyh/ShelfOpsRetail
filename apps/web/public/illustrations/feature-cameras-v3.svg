<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" width="960" height="540" role="img" aria-label="Denah toko isometric dengan dua kamera yang memancarkan cahaya ke zona, jalur pengunjung, dan kartu angka pengunjung.">
