<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" width="960" height="540" role="img" aria-label="Tabel saldo stok isometric dengan satu produk menipis, dan kartu perbandingan harga label dengan price book yang menemukan selisih.">
