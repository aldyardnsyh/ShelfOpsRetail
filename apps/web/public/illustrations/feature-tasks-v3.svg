<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" width="960" height="540" role="img" aria-label="Daftar tugas isometric dengan checkbox berwarna, dan kartu laporan berisi grafik tugas selesai per hari.">
  <style>
    .font-base { font-family="ui-sans-serif, system-ui, -apple-system, Segoe UI, sans-serif" }
    .font-mono { font-family="ui-monospace, SFMono-Regular, Menlo, monospace" }
    .pulse { animation: pulse 12s ease-in-out infinite; }
    .pulse2 { animation: pulse 12s ease-in-out infinite; animation-delay: -6s; }
